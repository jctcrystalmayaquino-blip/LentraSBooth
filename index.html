<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LentraSBooth | Hybrid Kiosk</title>
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        :root { --accent: #ff4757; --dark: #121212; }
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; }
        
        #stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; z-index: 10; cursor: pointer; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 25vw; font-weight: 900; z-index: 20; text-shadow: 0 0 30px rgba(0,0,0,0.8); pointer-events: none; }
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 21; pointer-events: none; }
        .flash-active { animation: flash 0.3s ease-out; }
        @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

        #hint { position: absolute; bottom: 10%; width: 100%; text-align: center; font-size: 1.5rem; font-weight: bold; z-index: 15; pointer-events: none; animation: pulse 2s infinite; text-shadow: 0 2px 10px rgba(0,0,0,1); }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* General Overlay Style */
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }

        /* Style Selection */
        .mode-btn { width: 250px; padding: 30px; margin: 15px; border-radius: 20px; border: 2px solid #fff; background: transparent; color: white; font-size: 1.5rem; font-weight: bold; cursor: pointer; }
        .mode-btn:active { background: var(--accent); border-color: var(--accent); }

        /* Image Grids */
        .options-container { display: flex; gap: 10px; width: 95%; max-width: 1000px; justify-content: center; }
        .option-card { width: 30%; cursor: pointer; border: 6px solid transparent; border-radius: 12px; overflow: hidden; position: relative; }
        .option-card img { width: 100%; display: block; }
        .option-card.selected { border-color: var(--accent); }

        /* Results */
        .result-scroll { display: flex; gap: 15px; max-width: 100%; overflow-x: auto; padding: 10px; }
        .preview-img { box-shadow: 0 20px 60px rgba(0,0,0,1); background: white; }
        .preview-img img { height: auto; max-height: 65vh; display: block; }
        
        .btn-row { display: flex; gap: 15px; margin-top: 25px; width: 100%; max-width: 500px; }
        .btn { flex: 1; padding: 18px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; text-transform: uppercase; }
        .save-btn { background: var(--accent); color: white; }
        .retake-btn { background: #333; color: white; }
    </style>
</head>
<body>

    <div id="stage" onclick="handleStageClick()">
        <div id="hint">TAP TO START</div>
        <div id="countdown"></div>
        <div id="flash"></div>
        <video id="video" autoplay playsinline></video>
    </div>

    <div id="modeOverlay" class="overlay">
        <h1>CHOOSE YOUR STYLE</h1>
        <button class="mode-btn" onclick="selectMode('INSTAX')">INSTAX<br><small>(Pick 2)</small></button>
        <button class="mode-btn" onclick="selectMode('STRIP')">STRIP<br><small>(All 3)</small></button>
    </div>

    <div id="selectionOverlay" class="overlay">
        <h2 style="margin-bottom: 20px;">PICK 2 FAVORITES</h2>
        <div class="options-container" id="options"></div>
    </div>

    <div id="resultOverlay" class="overlay">
        <div class="result-scroll" id="resultContent"></div>
        <div class="btn-row">
            <button class="btn save-btn" id="downloadBtn">SAVE TO GALLERY</button>
            <button class="btn retake-btn" onclick="resetBooth()">DONE</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const countdownEl = document.getElementById('countdown');
        const flashEl = document.getElementById('flash');
        const overlays = ['modeOverlay', 'selectionOverlay', 'resultOverlay'];
        
        let capturedImages = [];
        let selectedIndices = [];
        let isShooting = false;
        let finalFiles = [];
        let currentMode = "";

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(s => video.srcObject = s);

        function handleStageClick() {
            if (isShooting) return;
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            startSession();
        }

        async function startSession() {
            isShooting = true;
            document.getElementById('hint').style.display = 'none';
            capturedImages = [];
            
            for (let i = 0; i < 3; i++) {
                for (let c = 3; c > 0; c--) {
                    countdownEl.innerText = c;
                    await new Promise(r => setTimeout(r, 1000));
                }
                countdownEl.innerText = "";
                flashEl.classList.add('flash-active');
                setTimeout(() => flashEl.classList.remove('flash-active'), 300);

                const temp = document.createElement('canvas');
                temp.width = 800; temp.height = 1000;
                const tCtx = temp.getContext('2d');
                const vW = video.videoWidth, vH = video.videoHeight;
                const ratio = 800/1000;
                let sW = vW, sH = vW/ratio, sX = 0, sY = (vH - sH)/2;
                if (vW/vH > ratio) { sH = vH; sW = vH*ratio; sX = (vW - sW)/2; sY = 0; }

                tCtx.translate(temp.width, 0); tCtx.scale(-1, 1);
                tCtx.drawImage(video, sX, sY, sW, sH, 0, 0, temp.width, temp.height);
                capturedImages.push(temp.toDataURL('image/png'));
                await new Promise(r => setTimeout(r, 600)); 
            }
            document.getElementById('modeOverlay').style.display = 'flex';
        }

        function selectMode(mode) {
            currentMode = mode;
            document.getElementById('modeOverlay').style.display = 'none';
            if (mode === 'INSTAX') {
                showSelection();
            } else {
                processStrip();
            }
        }

        function showSelection() {
            const container = document.getElementById('options');
            container.innerHTML = '';
            document.getElementById('selectionOverlay').style.display = 'flex';
            capturedImages.forEach((src, idx) => {
                const div = document.createElement('div');
                div.className = 'option-card';
                div.innerHTML = `<img src="${src}">`;
                div.onclick = () => {
                    if (selectedIndices.includes(idx)) return;
                    selectedIndices.push(idx);
                    div.classList.add('selected');
                    if (selectedIndices.length === 2) setTimeout(processDoubleInstax, 500);
                };
                container.appendChild(div);
            });
        }

        async function processDoubleInstax() {
            document.getElementById('selectionOverlay').style.display = 'none';
            for (let idx of selectedIndices) {
                const data = await generateFrame(capturedImages[idx], 'INSTAX');
                addResultPreview(data);
            }
            showResults();
        }

        async function processStrip() {
            const data = await generateFrame(capturedImages, 'STRIP');
            addResultPreview(data);
            showResults();
        }

        function addResultPreview(data) {
            finalFiles.push(data);
            const div = document.createElement('div');
            div.className = 'preview-img';
            div.innerHTML = `<img src="${data}">`;
            document.getElementById('resultContent').appendChild(div);
        }

        function showResults() {
            document.getElementById('resultOverlay').style.display = 'flex';
            document.getElementById('downloadBtn').onclick = () => {
                finalFiles.forEach((f, i) => {
                    const a = document.createElement('a');
                    a.href = f; a.download = `Booth-${currentMode}-${i}.png`; a.click();
                });
                setTimeout(resetBooth, 1000);
            };
        }

        function generateFrame(input, type) {
            return new Promise(res => {
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                if (type === 'INSTAX') {
                    const p = 50, w = 800, h = 1000, bp = 250;
                    canvas.width = w + (p*2); canvas.height = h + p + bp;
                    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, p, p, w, h);
                        ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.lineWidth = 2;
                        ctx.strokeRect(p, p, w, h);
                        res(canvas.toDataURL());
                    };
                    img.src = input;
                } else {
                    const p = 40, w = 800, h = 1000;
                    canvas.width = w + (p*2); canvas.height = (h*3) + (p*4) + 100;
                    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
                    let loaded = 0;
                    input.forEach((src, i) => {
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, p, p + (i*(h+p)), w, h);
                            loaded++;
                            if(loaded === 3) res(canvas.toDataURL());
                        };
                        img.src = src;
                    });
                }
            });
        }

        function resetBooth() {
            overlays.forEach(id => document.getElementById(id).style.display = 'none');
            isShooting = false; selectedIndices = []; finalFiles = [];
            document.getElementById('resultContent').innerHTML = '';
            document.getElementById('hint').style.display = 'block';
        }
    </script>
</body>
</html>
